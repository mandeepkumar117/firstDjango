<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { text-align: center; font-size: 24px; margin-bottom: 20px; }
        .button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Student Attendance System</h2>
            <a href="{% url 'students_list' %}" class="button">View Students</a>
            <a href="{% url 'attendance_list' %}" class="button">View Attendance</a>
        </div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
